name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ubuntu 23.10+ blocks the unprivileged user namespaces Chrome's
      # sandbox needs. Lift that on the runner rather than running Chrome
      # without its sandbox.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: gofmt, vet and race-enabled tests
        run: make check
        env:
          OPENCRAWL_REQUIRE_CHROME: "1"
      - name: Build the CLI
        run: make opencrawl
      - name: Build the benchmark tools
        run: go build -o /dev/null ./cmd/bench/tui ./cmd/bench/benchserver
